version: '3'

volumes:
  unilab_local_postgres_data: {}
  unilab_local_postgres_data_backups: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: unilab_local_django
    container_name: unilab_local_django
    platform: linux/x86_64
    depends_on:
      - postgres
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: unilab_production_postgres
    container_name: unilab_local_postgres
    volumes:
      - unilab_local_postgres_data:/var/lib/postgresql/data:Z
      - unilab_local_postgres_data_backups:/backups:z
    env_file:
      - ./.envs/.local/.postgres

